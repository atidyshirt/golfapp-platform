# Git directory generator: each apps/*/deploy folder in the golfapp repo
# (github.com/atidyshirt/golf-ai-experiment) automatically becomes its own
# ArgoCD Application, with zero changes needed here when a new app/deploy
# folder appears later - this is what keeps each app independently
# deployable (see golfapp's AWP-11 for the rationale).
#
# NOTE: golf-ai-experiment is a private repo. ArgoCD needs its own
# registered credentials for this URL before this ApplicationSet can sync -
# see the repo's README for the one-time `argocd repo add` bootstrap step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golfapp
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:atidyshirt/golf-ai-experiment.git
        revision: main
        directories:
          - path: apps/*/deploy
  template:
    metadata:
      name: 'golfapp-{{path[1]}}'
    spec:
      project: default
      source:
        repoURL: git@github.com:atidyshirt/golf-ai-experiment.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: golfapp
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
