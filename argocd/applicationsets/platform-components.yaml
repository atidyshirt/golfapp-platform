# Cluster-wide dependencies. Starts with just the Argo Rollouts controller
# (needed for golfapp's Rollout CRDs to mean anything) - Istio/Gateway API
# get added here later as a separate epic, once there's a real cluster to
# install a mesh into. New platform components are new `elements` entries,
# not new files.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: argo-rollouts
            repoURL: https://argoproj.github.io/argo-helm
            chart: argo-rollouts
            targetRevision: '*'
            namespace: argo-rollouts
  template:
    metadata:
      name: 'platform-{{name}}'
    spec:
      project: default
      source:
        repoURL: '{{repoURL}}'
        chart: '{{chart}}'
        targetRevision: '{{targetRevision}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
