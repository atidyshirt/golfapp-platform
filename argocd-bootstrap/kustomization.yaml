apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The official install manifest doesn't self-declare its namespace - it
# relies on being applied with `-n argocd` or, here, this transformer to
# inject it onto every namespaced resource. Without this, everything lands
# in whatever namespace is currently active (verified the hard way).
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
