# Same low-stakes local-dev-style credential as deploy/postgres/secret.yaml
# (see that file's comment) - preview data is disposable, so there's even
# less at stake here than in prod.
apiVersion: v1
kind: Secret
metadata:
  name: golfapp-postgres
type: Opaque
stringData:
  POSTGRES_USER: golfapp
  POSTGRES_PASSWORD: golfapp
  POSTGRES_DB: golfapp
