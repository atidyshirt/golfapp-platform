# Plain Secret (not 1Password-sourced) - this is purely an internal
# app<->db credential with no external stakes, matching apps/api's own
# "no real prod data yet, synchronize: true" stance in golfapp's
# app.module.ts. Same values as golfapp's docker-compose.yml, kept in
# sync deliberately so local dev and the cluster behave the same way.
apiVersion: v1
kind: Secret
metadata:
  name: golfapp-postgres
type: Opaque
stringData:
  POSTGRES_USER: golfapp
  POSTGRES_PASSWORD: golfapp
  POSTGRES_DB: golfapp
