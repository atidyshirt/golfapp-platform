apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/services/api
  - ../../base/services/web
  - ../../base/services/postgres
  - ../../base/services/synthetic-traffic
  # - ../../base/services/dotgolf-service
  - ../../base/services/coursepack-service
  # Not active yet - no image has been built/pushed (no trigger workflow
  # exists until ATI-181 lands and runs once). Uncomment once GHCR has a
  # real tag to pull, same bootstrap sequencing coursepack-service needed
  # (see its "Activate coursepack-service in production overlay" commit).
  # - ../../base/services/rapsodo-service

replacements:
  - source:
      kind: Rollout
      name: golfapp-api
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: golfapp-api
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: golfapp-api-preview
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
  - source:
      kind: Rollout
      name: golfapp-web
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: golfapp-web
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: golfapp-web-preview
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
