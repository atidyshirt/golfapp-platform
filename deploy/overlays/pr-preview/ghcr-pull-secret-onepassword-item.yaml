# Same item + pattern as home-server's applications/ghcr-pull-secret/base (also used by
# project-template and argo-workflows there) - copied rather than shared cross-repo, matching
# that repo's own convention. Production's `golf` namespace has this secret already, applied
# out-of-band; golf-pr-* namespaces are created fresh per PR and need it provisioned here.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-push
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
spec:
  itemPath: "vaults/homelab/items/ghcr-push"
