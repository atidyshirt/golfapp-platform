apiVersion: v1
kind: ServiceAccount
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch]
  # Needed to add imagePullSecrets to the namespace's own default
  # ServiceAccount.
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ghcr-pull-secret-writer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: '-1'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ghcr-pull-secret-writer
subjects:
  - kind: ServiceAccount
    name: ghcr-pull-secret-writer
