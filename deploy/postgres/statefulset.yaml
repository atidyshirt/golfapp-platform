# StatefulSet, not a Rollout/Deployment - stable storage identity matters
# for a database in a way it doesn't for the stateless api/web/
# dotgolf-service apps, and canary/rolling-update semantics don't apply
# to a single-instance datastore. Same postgres:16-alpine image as
# golfapp's docker-compose.yml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golfapp-postgres
  labels:
    app: golfapp-postgres
spec:
  serviceName: golfapp-postgres
  replicas: 1
  selector:
    matchLabels:
      app: golfapp-postgres
  template:
    metadata:
      labels:
        app: golfapp-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: golfapp-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # Postgres wants an empty dir to initdb into, not the
              # lost+found-containing root of a freshly provisioned
              # volume - matches golfapp-postgres-data's own subPath-free
              # setup in docker-compose, but PVs commonly need this.
              subPath: pgdata
            - name: hba-config
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
          readinessProbe:
            exec:
              command: [pg_isready, -U, golfapp]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, golfapp]
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: hba-config
          configMap:
            name: golfapp-postgres-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # No default StorageClass exists in this cluster, and this field
        # was left unset - the PVC never bound ("no persistent volumes
        # available for this claim and no storage class is set"),
        # confirmed live. workspace-nfs is the established convention for
        # real (non-scratch) storage elsewhere in the homelab (see
        # applications/argo-workflows/base/workflowtemplates/build-and-
        # deploy.yaml), so used here too rather than local-path, which
        # would pin this StatefulSet to whichever single node happens to
        # provision it first.
        storageClassName: workspace-nfs
        resources:
          requests:
            storage: 5Gi
