apiVersion: batch/v1
kind: Job
metadata:
  name: golfapp-postgres-bootstrap-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap-db
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: golfapp-postgres
          command: [sh, -c]
          args:
            - |
              set -eu
              export PGPASSWORD="$POSTGRES_PASSWORD"

              until pg_isready -h golfapp-postgres -U "$POSTGRES_USER"; do
                echo "waiting for golfapp-postgres..."
                sleep 2
              done

              # Connect via template1, not postgres: template1 is created
              # earlier in initdb than postgres is, so it's still there even
              # on a cluster whose initdb got killed before its final step -
              # seen live, where golfapp-postgres-0's PVC was left with
              # template0/template1 but no postgres db, permanently wedging
              # any hook that assumed postgres always exists.
              create_db_if_missing() {
                db="$1"
                exists=$(psql -h golfapp-postgres -U "$POSTGRES_USER" -d template1 -tAc \
                  "SELECT 1 FROM pg_database WHERE datname = '$db'")
                if [ "$exists" = "1" ]; then
                  echo "database $db already exists, nothing to do"
                else
                  echo "creating database $db"
                  psql -h golfapp-postgres -U "$POSTGRES_USER" -d template1 -c \
                    "CREATE DATABASE \"$db\""
                fi
              }

              create_db_if_missing postgres
              create_db_if_missing "$POSTGRES_DB"
