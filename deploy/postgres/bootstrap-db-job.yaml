# PostSync hook, not PreSync: this needs golfapp-postgres already synced
# *and* healthy (readinessProbe passing) so there's something to connect
# to. Every other hook Job in this homelab (see ghcr-pull-secret's
# job.yaml) is PreSync because it creates a prerequisite that must exist
# *before* the rest of a sync applies - the opposite ordering from what's
# needed here.
#
# Idempotent by design, and deliberately left in place to rerun on every
# sync rather than being a one-shot: the entire reason this exists is
# that postgres's own POSTGRES_DB bootstrap only runs against a
# genuinely empty data directory on first init. A PVC that already has
# any prior data dir content (predating POSTGRES_DB being set correctly,
# or left over from #4's storageClass migration requiring a PVC
# recreation) will never retroactively get "golfapp" created - confirmed
# live via the postgres pod's repeated `database "golfapp" does not
# exist` FATALs. Before this, that gap was silently papered over by
# someone running a manual `CREATE DATABASE` by hand at some point -
# tribal knowledge, invisible until the next from-scratch rebuild or PVC
# recreation. This makes that step git-tracked and repeatable instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: golfapp-postgres-bootstrap-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap-db
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: golfapp-postgres
          command: [sh, -c]
          args:
            - |
              set -eu
              export PGPASSWORD="$POSTGRES_PASSWORD"

              until pg_isready -h golfapp-postgres -U "$POSTGRES_USER"; do
                echo "waiting for golfapp-postgres..."
                sleep 2
              done

              # Connects to the always-present "postgres" admin database
              # (POSTGRES_DB's own database can't be connected to before
              # it exists) to check for and, if missing, create it.
              exists=$(psql -h golfapp-postgres -U "$POSTGRES_USER" -d postgres -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'")
              if [ "$exists" = "1" ]; then
                echo "database $POSTGRES_DB already exists, nothing to do"
              else
                echo "creating database $POSTGRES_DB"
                psql -h golfapp-postgres -U "$POSTGRES_USER" -d postgres -c \
                  "CREATE DATABASE \"$POSTGRES_DB\""
              fi
