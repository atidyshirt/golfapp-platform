apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# See deploy/api/components/replacements/kustomization.yaml for the full
# explanation of why this lives in a Component rather than inline.
replacements:
  - source:
      kind: Rollout
      name: golfapp-web
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: golfapp-web
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: golfapp-web-canary
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
