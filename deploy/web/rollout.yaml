# See deploy/api/rollout.yaml for the rationale. Canary steps unchanged
# from golfapp's original apps/web/deploy/rollout.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: golfapp-web
  labels:
    app: golfapp-web
  annotations:
    addons_domain: placeholder-domain
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: golfapp-web
  template:
    metadata:
      labels:
        app: golfapp-web
    spec:
      containers:
        - name: web
          image: ghcr.io/atidyshirt/golfapp-web:REPLACE_ME
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    canary:
      canaryService: golfapp-web-canary
      stableService: golfapp-web
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 60
        - setWeight: 100
