apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: golfapp-web
  labels:
    app: golfapp-web
  annotations:
    addons_domain: placeholder-domain
    docs: docs/rollout-automation.md
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: golfapp-web
  template:
    metadata:
      labels:
        app: golfapp-web
    spec:
      containers:
        - name: web
          image: ghcr.io/atidyshirt/golfapp-web:REPLACE_ME
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx.conf.template's proxy_pass target (see golfapp's
            # apps/web/nginx.conf.template) - "golfapp-api" is this
            # cluster's Service name, not the "api" docker-compose uses.
            - name: API_UPSTREAM
              value: golfapp-api
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    blueGreen:
      activeService: golfapp-web
      previewService: golfapp-web-preview
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
          - templateName: golfapp-web-health-check
        args:
          - name: rollouts-pod-template-hash
            valueFrom:
              podTemplateHashValue: Latest
