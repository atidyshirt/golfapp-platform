# argoproj.io Rollout instead of apps/v1 Deployment (AWP-11). Canary steps
# unchanged from golfapp's original apps/api/deploy/rollout.yaml.
# canaryService/stableService (see service.yaml / canary-service.yaml) let
# Argo Rollouts manage two distinct Services without a traffic mesh - the
# canary Service stays pinned to canary pods for preview via
# canary-httproute.yaml, right up until promotion.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: golfapp-api
  labels:
    app: golfapp-api
  annotations:
    addons_domain: placeholder-domain
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: golfapp-api
  template:
    metadata:
      labels:
        app: golfapp-api
    spec:
      containers:
        - name: api
          image: ghcr.io/atidyshirt/golfapp-api:REPLACE_ME
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_HOST
              value: golfapp-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: golfapp
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_PASSWORD
            # Not "production" - keeps GET /auth/dev-login enabled, same
            # as golfapp's own docker-compose.yml (no real prod auth
            # wired up yet - see app.module.ts's synchronize: comment).
            - name: NODE_ENV
              value: development
            # Where auth redirects send the browser back to - must match
            # the web HTTPRoute's real hostname (golf.<domain>, not the
            # golfapp-web Service name, and https:// - the gateway
            # terminates TLS). Was previously wrong on both counts (AWP-58),
            # which broke the post-login redirect regardless of OAuth
            # provider config. Shared by canary and stable pods (one
            # Rollout template) - a canary-hosted login currently redirects
            # back to the stable host, not golf-canary; a known follow-up,
            # not fixed here since it needs host-aware redirect logic, not
            # just a corrected static value.
            - name: FRONTEND_ORIGIN
              value: https://golf.homelab.arpa
            # DexStrategy (apps/api/src/app/auth/dex.strategy.ts) - golfapp
            # registered as a Dex static client (id: golfapp), not talking to
            # Auth0 directly, per home-server's use-standalone-dex-for-sso
            # ADR. DEX_CLIENT_SECRET comes from the oidc-dex OnePasswordItem
            # (onepassword-item.yaml) - the same underlying 1Password item
            # Dex itself reads, synced into this namespace since Secrets are
            # namespace-scoped.
            - name: DEX_ISSUER
              value: https://dex.homelab.arpa
            - name: DEX_CLIENT_ID
              value: golfapp
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-dex
                  key: golfapp
            # Same shared-template limitation as FRONTEND_ORIGIN above - both
            # golf.homelab.arpa and golf-canary.homelab.arpa are registered
            # as valid Dex redirect URIs, but this static value means canary
            # logins still redirect back to the stable host post-callback
            # until AWP-59's host-aware routing fix lands.
            - name: DEX_CALLBACK_URL
              value: https://golf.homelab.arpa/api/auth/dex/callback
            - name: DOTGOLF_SERVICE_BASE_URL
              value: http://golfapp-dotgolf-service
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    canary:
      canaryService: golfapp-api-canary
      stableService: golfapp-api
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 60
        - setWeight: 100
