apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: golfapp-api
  labels:
    app: golfapp-api
  annotations:
    addons_domain: placeholder-domain
    docs: docs/rollout-automation.md
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: golfapp-api
  template:
    metadata:
      labels:
        app: golfapp-api
    spec:
      initContainers:
        - name: ensure-db
          image: postgres:16-alpine
          env:
            - name: DB_HOST
              value: golfapp-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: golfapp
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME"; do sleep 2; done
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d template1 -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 \
                || psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d template1 \
                  -c "CREATE DATABASE \"$DB_NAME\" OWNER \"$DB_USERNAME\""
      containers:
        - name: api
          image: ghcr.io/atidyshirt/golfapp-api:REPLACE_ME
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_HOST
              value: golfapp-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: golfapp
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golfapp-postgres
                  key: POSTGRES_PASSWORD
            # Not "production" - keeps GET /auth/dev-login enabled, same
            # as golfapp's own docker-compose.yml (no real prod auth
            # wired up yet - see app.module.ts's synchronize: comment).
            - name: NODE_ENV
              value: development
            # Where auth redirects send the browser back to - must match
            # the web HTTPRoute's real hostname (golf.<domain>, not the
            # golfapp-web Service name, and https:// - the gateway
            # terminates TLS). Was previously wrong on both counts (AWP-58),
            # which broke the post-login redirect regardless of OAuth
            # provider config. Shared by preview and active pods (one
            # Rollout template) - a preview-hosted login currently redirects
            # back to the active host, not golf-api-preview; a known
            # follow-up, not fixed here since it needs host-aware redirect
            # logic, not just a corrected static value.
            - name: FRONTEND_ORIGIN
              value: https://golf.homelab.arpa
            # DexStrategy (apps/api/src/app/auth/dex.strategy.ts) - golfapp
            # registered as a Dex static client (id: golfapp), not talking to
            # Auth0 directly, per home-server's use-standalone-dex-for-sso
            # ADR. DEX_CLIENT_SECRET comes from the oidc-dex OnePasswordItem
            # (onepassword-item.yaml) - the same underlying 1Password item
            # Dex itself reads, synced into this namespace since Secrets are
            # namespace-scoped.
            - name: DEX_ISSUER
              value: https://dex.homelab.arpa
            # dex.homelab.arpa only resolves via the LAN's own DNS, not the
            # cluster's internal CoreDNS - confirmed live (ENOTFOUND from
            # inside this pod, AWP-58). DexStrategy uses this in-cluster
            # Service address for its own token/userinfo calls instead
            # (DEX_ISSUER stays external - the browser needs it for the
            # /auth redirect, and Dex signs ID tokens with that same
            # external issuer regardless of how this service reaches it).
            - name: DEX_INTERNAL_URL
              value: http://dex.dex.svc.cluster.local:5556
            - name: DEX_CLIENT_ID
              value: golfapp
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-dex
                  key: golfapp
            # Same shared-template limitation as FRONTEND_ORIGIN above - both
            # golf.homelab.arpa and golf-preview.homelab.arpa are registered
            # as valid Dex redirect URIs, but this static value means
            # preview logins still redirect back to the active host
            # post-callback until AWP-59's host-aware routing fix lands.
            - name: DEX_CALLBACK_URL
              value: https://golf.homelab.arpa/api/auth/dex/callback
            - name: DOTGOLF_SERVICE_BASE_URL
              value: http://golfapp-dotgolf-service
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
  strategy:
    blueGreen:
      activeService: golfapp-api
      previewService: golfapp-api-preview
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
          - templateName: golfapp-api-health-check
        args:
          - name: rollouts-pod-template-hash
            valueFrom:
              podTemplateHashValue: Latest
