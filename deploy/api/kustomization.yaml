apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rollout.yaml
  - service.yaml
  - canary-service.yaml
  - httproute.yaml
  - canary-httproute.yaml

# See homelab-deploy-template's kustomization.yaml for the full explanation
# of this gitops-bridge domain-templating pattern.
replacements:
  - source:
      kind: Rollout
      name: golfapp-api
      fieldPath: metadata.annotations.addons_domain
    targets:
      - select:
          kind: HTTPRoute
          name: golfapp-api
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: HTTPRoute
          name: golfapp-api-canary
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: '.'
          index: 1
