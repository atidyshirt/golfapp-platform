apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rollout.yaml
- service.yaml
- canary-service.yaml
- httproute.yaml
- canary-httproute.yaml

# See homelab-deploy-template's kustomization.yaml for the full explanation
# of this gitops-bridge domain-templating pattern.
replacements:
- source:
    fieldPath: metadata.annotations.addons_domain
    kind: Rollout
    name: golfapp-api
  targets:
  - fieldPaths:
    - spec.hostnames.0
    options:
      delimiter: .
      index: 1
    select:
      kind: HTTPRoute
      name: golfapp-api
  - fieldPaths:
    - spec.hostnames.0
    options:
      delimiter: .
      index: 1
    select:
      kind: HTTPRoute
      name: golfapp-api-canary
images:
- name: ghcr.io/atidyshirt/golfapp-api
  newName: ghcr.io/atidyshirt/golfapp-api
  newTag: 5c632436730d351c3f4cfb6236ff4f40a0efe97e
