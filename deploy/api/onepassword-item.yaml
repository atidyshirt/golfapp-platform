# Mirrors home-server's applications/dex/base/onepassword-items.yaml
# pattern (1Password Connect operator, already installed cluster-wide per
# home-server's addon-onepassword-operator-appset.yaml) rather than
# committing a real secret value to this repo - the golfapp Dex client
# secret is real credential material, unlike deploy/postgres/secret.yaml's
# low-stakes local dev password.
#
# Same underlying 1Password item Dex itself already reads
# (vaults/homelab/items/oidc.dex), just synced into a second Secret in
# this namespace (K8s Secrets are namespace-scoped) - requires the new
# "golfapp" field added to that item first (see AWP-58).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-dex
  namespace: golf
spec:
  itemPath: "vaults/homelab/items/oidc.dex"
