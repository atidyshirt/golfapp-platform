# Same underlying 1Password item as deploy/api/onepassword-item.yaml - not
# reused directly because that copy hardcodes `namespace: golf`, which
# would sync into prod's namespace instead of this Application's per-PR
# golf-pr-<number> one. Leaving namespace unset here lets ArgoCD scope it
# to whatever namespace this Application's destination targets (see
# addon-golfapp-preview-appset.yaml in home-server).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: oidc-dex
spec:
  itemPath: "vaults/homelab/items/oidc.dex"
